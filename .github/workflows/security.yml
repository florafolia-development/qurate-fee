name: security

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action needs a paid licence for organisation
      # repositories. The binary does not. Pinned, because an unpinned
      # scanner is a supply chain of its own.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --verbose

      - name: Scan the history
        run: gitleaks git . --redact --no-banner --verbose

# A dependency review job belongs here, and cannot run yet:
# actions/dependency-review-action needs the repository's Dependency graph
# switched on, under Settings, Advanced Security. The same setting turns on
# Dependabot security alerts, so it is worth having either way. Add the job
# back once it is enabled.
